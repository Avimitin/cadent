[project]
name = "itg-ai"
version = "0.1.0"
description = "Experiments in local Qwen adaptation for ITG simfiles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.4.2",
    "huggingface-hub>=0.34,<1",
    "librosa==0.11.0",
    "peft==0.18.1",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "safetensors>=0.4.3",
    # simfile 2.x uses fs, which still imports pkg_resources.
    "setuptools==80.9.0",
    "simfile==2.1.1",
    "soundfile==0.13.1",
    "tensorboard==2.21.0",
    "torch==2.9.1",
    "transformers==4.57.6",
    "trl==0.24.0",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]
cuda = ["torch==2.9.1", "bitsandbytes==0.49.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
